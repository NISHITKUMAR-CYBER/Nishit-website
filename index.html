<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nishit Kumar | Futuristic Profile</title>
    <style>
      :root {
        --bg: #050816;
        --bg-2: #0b1023;
        --panel: rgba(14, 22, 44, 0.72);
        --panel-border: rgba(110, 231, 255, 0.35);
        --primary: #7cf7ff;
        --secondary: #9d7bff;
        --accent: #6ef2b5;
        --text: #edf6ff;
        --muted: #b7c4db;
        --shadow: rgba(124, 247, 255, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(157, 123, 255, 0.28), transparent 25%),
          radial-gradient(circle at bottom right, rgba(110, 242, 181, 0.22), transparent 28%),
          linear-gradient(135deg, var(--bg), var(--bg-2));
        color: var(--text);
        overflow-x: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: auto;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.4;
        pointer-events: none;
        z-index: 0;
      }

      body::before {
        top: -120px;
        left: -80px;
        background: rgba(124, 247, 255, 0.35);
      }

      body::after {
        right: -100px;
        bottom: -120px;
        background: rgba(157, 123, 255, 0.32);
      }

      .stars {
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.8), transparent),
          radial-gradient(2px 2px at 60% 10%, rgba(124,247,255,0.8), transparent),
          radial-gradient(1.5px 1.5px at 80% 60%, rgba(255,255,255,0.9), transparent),
          radial-gradient(2px 2px at 30% 80%, rgba(157,123,255,0.8), transparent),
          radial-gradient(2px 2px at 70% 75%, rgba(110,242,181,0.8), transparent);
        background-repeat: repeat;
        background-size: 320px 320px;
        opacity: 0.9;
        z-index: 0;
      }

      .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      .card {
        width: min(940px, 100%);
        background: rgba(12, 18, 32, 0.72);
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        box-shadow: 0 0 35px rgba(124, 247, 255, 0.18), 0 0 80px rgba(157, 123, 255, 0.12);
        backdrop-filter: blur(10px);
        overflow: hidden;
        position: relative;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent, rgba(124,247,255,0.08), transparent);
        transform: translateX(-100%);
        animation: sweep 9s linear infinite;
      }

      @keyframes sweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      .content {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        align-items: center;
        gap: 28px;
        padding: 54px 42px;
      }

      .text {
        position: relative;
      }

      .tag {
        display: inline-block;
        padding: 8px 14px;
        border: 1px solid rgba(124, 247, 255, 0.45);
        background: rgba(124, 247, 255, 0.08);
        border-radius: 999px;
        letter-spacing: 0.18em;
        font-size: 11px;
        text-transform: uppercase;
        color: var(--primary);
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.7rem, 6vw, 5.2rem);
        line-height: 0.96;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-shadow: 0 0 18px rgba(124, 247, 255, 0.45);
      }

      .highlight {
        display: block;
        background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .sub {
        margin-top: 18px;
        font-size: clamp(1rem, 2vw, 1.35rem);
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .bio {
        margin-top: 22px;
        max-width: 560px;
        color: rgba(237, 246, 255, 0.82);
        font-size: 1.02rem;
        line-height: 1.7;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 30px;
      }

      .cta {
        margin-top: 28px;
      }

      .cta a {
        display: inline-block;
        padding: 14px 22px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        color: #051720;
        box-shadow: 0 0 20px rgba(124, 247, 255, 0.25);
      }

      .stat {
        min-width: 120px;
        padding: 18px 16px;
        border-radius: 18px;
        border: 1px solid rgba(124, 247, 255, 0.22);
        background: rgba(11, 16, 35, 0.8);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
      }

      .stat strong {
        display: block;
        font-size: clamp(1.4rem, 2vw, 2rem);
        color: var(--primary);
      }

      .stat span {
        font-size: 0.76rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .visual {
        display: grid;
        place-items: center;
      }

      .orb-wrap {
        position: relative;
        width: min(340px, 80vw);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }

      .orb {
        position: relative;
        width: 82%;
        height: 82%;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #c7fbff, #79d9ff 18%, #7a6dff 48%, rgba(8,10,24,0.95) 68%, rgba(9,12,26,1) 100%);
        box-shadow: 0 0 30px rgba(124, 247, 255, 0.35), 0 0 70px rgba(157, 123, 255, 0.22);
        border: 1px solid rgba(124, 247, 255, 0.5);
        animation: float 5s ease-in-out infinite;
      }

      .orb::before,
      .orb::after {
        content: "";
        position: absolute;
        inset: 12%;
        border-radius: 50%;
        border: 1px solid rgba(124,247,255,0.35);
      }

      .orb::after {
        inset: 24%;
        border-color: rgba(110,242,181,0.4);
      }

      .ring {
        position: absolute;
        inset: 8%;
        border-radius: 50%;
        border: 1px solid rgba(124,247,255,0.25);
        transform: rotateX(65deg);
        box-shadow: 0 0 18px rgba(124,247,255,0.18);
      }

      .ring.r2 {
        inset: 18%;
        border-color: rgba(157,123,255,0.35);
        animation: pulse 2.8s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-14px); }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1) rotateX(65deg); opacity: 0.9; }
        50% { transform: scale(1.08) rotateX(65deg); opacity: 1; }
      }

      @media (max-width: 760px) {
        .content {
          grid-template-columns: 1fr;
          padding: 36px 24px;
        }

        .stats {
          display: grid;
          grid-template-columns: repeat(3, minmax(90px, 1fr));
        }
      }

      @media (max-width: 520px) {
        .stats {
          grid-template-columns: 1fr;
        }

        .bio {
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="stars"></div>

    <main class="page">
      <section class="card">
        <div class="content">
          <div class="text">
            <div class="tag">Student Profile</div>
            <h1>
              <span class="highlight">Nishit</span>
              Kumar
            </h1>

            <div class="sub">Age 13 • Class 7 D</div>

            <p class="bio">
              Future-focused, curious, and full of energy. Nishit Kumar is a bright student with a passion for learning,
              creativity, and imagining bigger possibilities for tomorrow.
            </p>

            <div class="stats">
              <div class="stat">
                <strong>13</strong>
                <span>Years</span>
              </div>
              <div class="stat">
                <strong>7D</strong>
                <span>Class</span>
              </div>
              <div class="stat">
                <strong>AI</strong>
                <span>Future</span>
              </div>
            </div>

            <div class="cta">
              <a href="register.html">Go to Registration</a>
            </div>
          </div>

          <div class="visual" aria-label="Futuristic profile visual">
            <div class="orb-wrap">
              <div class="ring"></div>
              <div class="ring r2"></div>
              <div class="orb"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
