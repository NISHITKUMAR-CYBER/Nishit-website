<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Portal</title>
    <style>
      :root {
        --bg: #040814;
        --bg-2: #0b1120;
        --panel: rgba(10, 16, 31, 0.8);
        --primary: #7cf7ff;
        --secondary: #9d7bff;
        --accent: #6ef2b5;
        --text: #edf6ff;
        --muted: #b8c4da;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, sans-serif;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(124,247,255,0.18), transparent 25%),
          radial-gradient(circle at bottom right, rgba(157,123,255,0.18), transparent 30%),
          linear-gradient(135deg, var(--bg), var(--bg-2));
        color: var(--text);
      }

      .stars {
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.8), transparent),
          radial-gradient(2px 2px at 70% 25%, rgba(124,247,255,0.7), transparent),
          radial-gradient(2px 2px at 85% 70%, rgba(157,123,255,0.8), transparent),
          radial-gradient(1.5px 1.5px at 30% 75%, rgba(255,255,255,0.7), transparent);
        opacity: 0.85;
      }

      .panel {
        position: relative;
        z-index: 1;
        width: min(460px, 90vw);
        padding: 28px 24px;
        border-radius: 24px;
        background: rgba(11, 18, 32, 0.8);
        border: 1px solid rgba(124,247,255,0.3);
        box-shadow: 0 0 28px rgba(124,247,255,0.16), 0 0 60px rgba(157,123,255,0.12);
        backdrop-filter: blur(12px);
      }

      h1 {
        margin: 0 0 8px;
        text-align: center;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--primary);
      }

      .subtitle {
        margin: 0 0 24px;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }

      form {
        display: grid;
        gap: 18px;
      }

      label {
        font-size: 0.82rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      input {
        width: 100%;
        margin-top: 8px;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(124,247,255,0.3);
        background: rgba(6, 11, 20, 0.9);
        color: var(--text);
        font-size: 1rem;
        outline: none;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(124,247,255,0.12);
      }

      .button-row {
        display: flex;
        gap: 12px;
        margin-top: 8px;
      }

      button, .link-btn {
        flex: 1;
        border: none;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        text-align: center;
        cursor: pointer;
      }

      button {
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        color: #06111f;
      }

      .link-btn {
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border: 1px solid rgba(124,247,255,0.3);
      }

      .demo {
        margin-top: 22px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(124,247,255,0.06);
        border: 1px solid rgba(124,247,255,0.2);
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.6;
      }

      .message {
        min-height: 24px;
        margin-top: 14px;
        text-align: center;
        font-weight: 600;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="stars"></div>

    <div class="panel">
      <h1>Register</h1>
      <p class="subtitle">Secure access portal</p>

      <form id="loginForm">
        <div>
          <label for="userId">User ID</label>
          <input id="userId" name="userId" type="text" placeholder="Enter your user ID" required />
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" required />
        </div>

        <div class="button-row">
          <button type="submit">Sign In</button>
          <a class="link-btn" href="index.html">Home</a>
        </div>
      </form>

      <div class="demo">
        Demo account:<br>
        User ID: 1100<br>
        Password: 1234
      </div>

      <div id="message" class="message"></div>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const message = document.getElementById('message');

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const userId = document.getElementById('userId').value.trim();
        const password = document.getElementById('password').value.trim();

        if (userId === '1100' && password === '1234') {
          message.textContent = 'Login successful! Redirecting...';
          message.style.color = '#6ef2b5';
          setTimeout(() => {
            window.location.href = 'thankyou.html';
          }, 1200);
        } else {
          message.textContent = 'Invalid user ID or password.';
          message.style.color = '#ff8d8d';
        }
      });
    </script>
  </body>
</html>
