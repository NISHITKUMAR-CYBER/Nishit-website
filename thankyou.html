<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | crysonic_editz</title>
    <style>
      :root {
        --bg: #040b17;
        --bg-2: #0d1830;
        --panel: rgba(11, 18, 32, 0.8);
        --primary: #7cf7ff;
        --secondary: #9d7bff;
        --accent: #ff5ea8;
        --text: #edf6ff;
        --muted: #b8c4da;
        --success: #6ef2b5;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(124,247,255,0.22), transparent 24%),
          radial-gradient(circle at bottom right, rgba(157,123,255,0.22), transparent 30%),
          linear-gradient(135deg, var(--bg), var(--bg-2));
      }

      .stars {
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(2px 2px at 12% 20%, rgba(255,255,255,0.8), transparent),
          radial-gradient(2px 2px at 65% 18%, rgba(124,247,255,0.7), transparent),
          radial-gradient(2px 2px at 80% 75%, rgba(157,123,255,0.8), transparent),
          radial-gradient(1.5px 1.5px at 25% 75%, rgba(255,255,255,0.8), transparent);
        opacity: 0.9;
      }

      .card {
        position: relative;
        z-index: 1;
        width: min(700px, 90vw);
        padding: 40px 30px;
        border-radius: 26px;
        background: rgba(11, 18, 32, 0.82);
        border: 1px solid rgba(124,247,255,0.32);
        box-shadow: 0 0 26px rgba(124,247,255,0.14), 0 0 62px rgba(157,123,255,0.1);
        text-align: center;
        backdrop-filter: blur(12px);
      }

      .badge {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(124,247,255,0.09);
        border: 1px solid rgba(124,247,255,0.26);
        color: var(--primary);
        letter-spacing: 0.12em;
        font-size: 0.8rem;
        text-transform: uppercase;
      }

      h1 {
        margin: 22px 0 12px;
        font-size: clamp(2.7rem, 6vw, 4.6rem);
        line-height: 1;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .highlight {
        background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.8;
        margin: 18px auto 0;
        max-width: 520px;
      }

      .cta {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 28px;
      }

      .btn {
        display: inline-block;
        padding: 16px 26px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: 0.2s ease;
      }

      .subscribe {
        background: linear-gradient(90deg, #ff4d94, #ff8a65);
        color: white;
        box-shadow: 0 0 25px rgba(255, 94, 168, 0.22);
      }

      .home {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(124,247,255,0.26);
        color: var(--text);
      }

      .mini {
        margin-top: 24px;
        font-size: 0.88rem;
        color: var(--success);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="stars"></div>

    <div class="card">
      <div class="badge">Welcome</div>
      <h1><span class="highlight">Thank You</span></h1>
      <p>
        Thank you for visiting! Your support means a lot. Please subscribe to my YouTube channel
        <strong>crysonic_editz</strong> and stay connected for more exciting content.
      </p>

      <div class="cta">
        <a class="btn subscribe" href="https://www.youtube.com/@crysonic_editz" target="_blank" rel="noopener noreferrer">Subscribe</a>
        <a class="btn home" href="index.html">Back to Home</a>
      </div>

      <div class="mini">Enjoy the journey!</div>
    </div>
  </body>
</html>
